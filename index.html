<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}
.strip{height:4px;background:repeating-linear-gradient(90deg,var(--gold) 0 18px,var(--green) 18px 36px,var(--red) 36px 48px,#111 48px 60px)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;max-width:640px;margin:0 auto;font:800 24px 'Bricolage Grotesque',sans-serif}

main{max-width:640px;margin:0 auto;padding:8px 16px 110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}

.chips{display:flex;gap:6px;margin:0 0 12px}
.chip{flex:none;white-space:nowrap;font:500 13px 'DM Sans';border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--mute);background:none;cursor:pointer}
.chip.on{color:var(--green);border-color:var(--green);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--gold)}
.btn{border:0;background:var(--green);color:var(--on-green);font:700 15px 'DM Sans';padding:11px 18px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.red{background:none;color:var(--red);border:1px solid var(--red)}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:700 14px 'DM Sans';padding:9px;border-radius:999px;cursor:pointer}.seg button.on{background:var(--green);color:var(--on-green)}
.st{font-weight:700;font-size:13px}.st.pending,.st.draft{color:var(--warn)}.st.approved,.st.live{color:var(--ok)}.st.rejected{color:var(--red)}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input,textarea,select{width:100%;font:16px 'DM Sans';padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.bal{font:800 40px 'Bricolage Grotesque'}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.in{color:var(--ok);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:640px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mute);font:700 12px 'DM Sans';padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-top:3px solid transparent}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--green);border-top-color:var(--gold)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}#modal.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%}#toast.on{opacity:1}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;margin:6px 0;background:var(--bg)}.bub.me{margin-left:auto;background:var(--green);color:var(--on-green)}.bub small{opacity:.7}a{color:var(--green)}.empty{text-align:center;color:var(--mute);padding:28px 10px}
</style>
</head>

back(){S.cid=null;view()},
async join(){const{error}=await sb.rpc('join_campaign',{p_campaign:S.cid});toast(error?error.message:'You joined this campaign');view()},
submit(){const rs=(S.c.rewards||[]).filter(r=>r.funded>r.spent);if(!rs.length)return toast('No open rewards right now');modal(`<h2>Submit a clip</h2><label>Reward</label><select id="rw">${rs.map(r=>`<option value="${r.id}">${esc(r.brand_name||'')} · ${esc(r.title)} · ${fm(r.rate_per_1k,r.currency)}/1,000</option>`).join('')}</select><label>Platform</label><select id="pl">${(S.c.platforms||[]).map(p=>`<option value="${p}">${PL[p]||p}</option>`).join('')}</select><label>Link to your posted clip</label><input id="l" type="url" placeholder="https://…"><div class="note">Views are tracked automatically. You never enter them.</div><div class="btns"><button class="btn" data-a="sendclip">Submit clip</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async sendclip(){const url=val('l');if(!/^https?:\/\//i.test(url))return toast('Add the link to your posted clip');const{error}=await sb.from('submissions').insert({reward_id:val('rw'),platform:val('pl'),url});if(error)return toast(error.code==='23505'?'This link was already submitted':error.code==='42501'?'Join the campaign first':error.message);closeM();toast('Clip submitted');view()},
edit(){modal(`<h2>Edit profile</h2><label>Name</label><input id="n" value="${esc(P.name)}"><label>Phone</label><input id="p" value="${esc(P.phone)}"><label>City</label><input id="c" value="${esc(P.city)}"><div class="btns"><button class="btn" data-a="saveu">Save</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async saveu(){const u={name:val('n'),phone:val('p'),city:val('c')};const{error}=await sb.from('profiles').update(u).eq('id',U.id);if(error)return toast(error.message);Object.assign(P,u);closeM();view();toast('Saved')},
new(){modal(`<h2>New campaign</h2><label>Campaign title</label><input id="t"><label>What is this campaign about?</label><textarea id="b" rows="3"></textarea><label>Category</label><select id="c">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><label>Where should clips be posted?</label><div id="pls">${Object.entries(PL).map(([k,v])=>`<label style="display:flex;gap:10px;align-items:center;font-weight:500;margin:6px 0"><input type="checkbox" value="${k}" ${k!=='x'?'checked':''} style="width:auto"> ${v}</label>`).join('')}</div><label>Brand name creators will see</label><input id="bn" value="${esc(P.name)}"><div class="note">You can add rewards from several brands inside one campaign.</div><div class="btns"><button class="btn" data-a="create">Create campaign</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async create(){const t=val('t'),b=val('b'),pls=[...document.querySelectorAll('#pls input:checked')].map(i=>i.value);if(!t||!b)return toast('Add a title and description');if(!pls.length)return toast('Pick at least one platform');const{data,error}=await sb.from('campaigns').insert({title:t,brief:b,category:val('c'),platforms:pls,brand_name:val('bn')||P.name||'Brand'}).select('id').single();if(error)return toast(error.message);closeM();S.cid=data.id;toast('Campaign created. Add your first reward.');view()},
rewards(){modal(`<h2>Add a reward</h2><label>Brand paying for it</label><input id="rb"><label>Reward title</label><input id="rt" placeholder="Clip the new single"><label>Rules</label><textarea id="rr" rows="3" placeholder="Length, hashtags, what to show"></textarea><label>Source content link (optional)</label><input id="ru" type="url"><label>Rate per 1,000 views (GHS)</label><input id="rp" type="number" inputmode="decimal" value="8"><label>Budget (GHS)</label><input id="rg" type="number" inputmode="decimal" value="300"><div class="note">After you save, pay the budget and we switch the reward on. Paystack checkout is coming.</div><div class="btns"><button class="btn" data-a="saverw">Save reward</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async saverw(){const t=val('rt'),p=+val('rp'),g=+val('rg');if(!t||p<=0||g<=0)return toast('Add a title, rate and budget');const{error}=await sb.from('rewards').insert({campaign_id:S.cid,brand_name:val('rb'),title:t,rules:val('rr'),source_url:val('ru')||null,rate_per_1k:p,target_budget:g});if(error)return toast(error.message);closeM();toast('Reward saved');view()},
msg(d){S.msg=d.id;view()},
async chat(d){S.ch=d.id;const{data:me}=await sb.from('campaign_members').select('role').eq('campaign_id',d.id).eq('user_id',U.id).maybeSingle();
 modal(`<h2>Campaign chat</h2><div class="meta">Everyone in this campaign can read this.</div><div id="cl" style="max-height:45vh;overflow:auto;margin:10px 0"></div><input id="cm" placeholder="Write a message">${me?.role==='manager'?'<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="an" type="checkbox" style="width:auto"> Send as announcement</label>':''}<div class="btns"><button class="btn" data-a="say">Send</button><button class="btn ghost" data-a="close">Close</button></div>`);
 await A.cload();clearInterval(S.pt);S.pt=setInterval(()=>{$('#cl')?A.cload():clearInterval(S.pt)},6000)},
async cload(){const{data}=await sb.from('campaign_messages').select('*').eq('campaign_id',S.ch).order('created_at',{ascending:true}).limit(100);const ids=[...new Set((data||[]).map(x=>x.user_id))],nm={};if(ids.length)((await sb.from('people').select('*').in('id',ids)).data||[]).forEach(p=>nm[p.id]=p.name);const e=$('#cl');if(!e)return;
 e.innerHTML=(data||[]).length?data.map(x=>`<div class="bub ${x.user_id===U.id?'me':''}">${x.is_announcement?'<b>Announcement</b><br>':''}<small>${esc(x.user_id===U.id?'You':nm[x.user_id]||'Member')}</small><br>${esc(x.body)}</div>`).join(''):'<div class="empty">No messages yet. Say hello.</div>';e.scrollTop=e.scrollHeight},
async say(){const b=val('cm');if(!b)return;const{error}=await sb.from('campaign_messages').insert({campaign_id:S.ch,body:b,is_announcement:!!$('#an')?.checked});if(error)return toast(error.message);$('#cm').value='';if($('#an'))$('#an').checked=false;A.cload()},
async dm(d){S.dc=d.c;S.dt=d.id;const{data:p}=await sb.from('people').select('name').eq('id',d.id).maybeSingle();
 modal(`<h2>${esc(p?.name||'Message')}</h2><div id="dl" style="max-height:45vh;overflow:auto;margin:10px 0"></div><input id="dmi" placeholder="Write a message"><div class="btns"><button class="btn" data-a="dsend">Send</button><button class="btn ghost" data-a="close">Close</button></div>`);
 await A.dload();clearInterval(S.pt);S.pt=setInterval(()=>{$('#dl')?A.dload():clearInterval(S.pt)},6000)},
async dload(){const{data}=await sb.from('direct_messages').select('*').eq('campaign_id',S.dc).or(`and(from_id.eq.${U.id},to_id.eq.${S.dt}),and(from_id.eq.${S.dt},to_id.eq.${U.id})`).order('created_at',{ascending:true}).limit(100);const e=$('#dl');if(!e)return;
 e.innerHTML=(data||[]).length?data.map(x=>`<div class="bub ${x.from_id===U.id?'me':''}">${esc(x.body)}</div>`).join(''):'<div class="empty">No messages yet.</div>';e.scrollTop=e.scrollHeight},
async dsend(){const b=val('dmi');if(!b)return;const{error}=await sb.rpc('send_dm',{p_campaign:S.dc,p_to:S.dt,p_body:b});if(error)return toast(error.message);$('#dmi').value='';A.dload()},
async cmgr(){const{data,error}=await sb.rpc('campaign_managers',{p_campaign:S.cid});if(error||!data?.length)return toast(error?.message||'No managers found');if(data.length===1)return A.dm({c:S.cid,id:data[0].id});
 modal(`<h2>Choose a manager</h2>${data.map(x=>`<div class="card" data-a="dm" data-c="${S.cid}" data-id="${x.id}" style="cursor:pointer"><b>${esc(x.name||'Manager')}</b></div>`).join('')}<div class="btns"><button class="btn ghost" data-a="close">Close</button></div>`)},
upl(){modal(`<h2>Upload files</h2><div class="meta">Add source videos, brand guides or documents. Up to 50 MB each. To share a whole folder, zip it first.</div><input id="up" type="file" multiple style="margin-top:12px"><div class="btns"><button class="btn" data-a="doup">Upload</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async doup(){const fs=[...$('#up').files];if(!fs.length)return toast('Choose a file first');toast('Uploading…');let n=0;for(const f of fs){if(f.size>52428800){toast(f.name+' is over 50 MB');continue}const path=`${S.cid}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g,'_')}`;const u=await sb.storage.from('campaign-files').upload(path,f);if(u.error){toast(u.error.message);continue}const r=await sb.from('campaign_files').insert({campaign_id:S.cid,name:f.name,path,size:f.size});if(r.error){toast(r.error.message);continue}n++}closeM();if(n)toast(n+' file'+(n>1?'s':'')+' uploaded');view()},
async dl(d){const{data,error}=await sb.storage.from('campaign-files').createSignedUrl(d.p,3600);if(error)return toast(error.message);modal(`<h2>${esc(d.n)}</h2><div class="btns"><a class="btn" href="${esc(data.signedUrl)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Open or download</a><button class="btn ghost" data-a="close">Close</button></div>`)},
async rmf(d){if(!confirm('Remove this file for everyone?'))return;await sb.storage.from('campaign-files').remove([d.p]);const{error}=await sb.from('campaign_files').delete().eq('id',d.id);toast(error?error.message:'File removed');view()},
editc(){const c=S.c;modal(`<h2>Edit campaign</h2><label>Title</label><input id="t" value="${esc(c.title)}"><label>Description</label><textarea id="b" rows="3">${esc(c.brief)}</textarea><label>Category</label><select id="c">${CATS.slice(1).map(x=>`<option ${x===c.category?'selected':''}>${x}</option>`).join('')}</select><label>Where should clips be posted?</label><div id="pls">${Object.entries(PL).map(([k,v])=>`<label style="display:flex;gap:10px;align-items:center;font-weight:500;margin:6px 0"><input type="checkbox" value="${k}" ${(c.platforms||[]).includes(k)?'checked':''} style="width:auto"> ${v}</label>`).join('')}</div><label>Brand name creators see</label><input id="bn" value="${esc(c.brand_name)}"><label>Status</label><select id="st">${['live','paused','ended'].map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select><div class="note">Paused or ended campaigns are hidden from Home.</div><div class="btns"><button class="btn" data-a="savec">Save changes</button><button class="btn ghost" data-a="close">Cancel</button></div>${c.owner_id===U.id?'<div class="btns"><button class="btn red" data-a="delc">Delete campaign</button></div>':''}`)},
async savec(){const pls=[...document.querySelectorAll('#pls input:checked')].map(i=>i.value);if(!val('t')||!val('b'))return toast('Add a title and description');if(!pls.length)return toast('Pick at least one platform');const{error}=await sb.from('campaigns').update({title:val('t'),brief:val('b'),category:val('c'),platforms:pls,brand_name:val('bn'),status:val('st')}).eq('id',S.cid);if(error)return toast(error.message);closeM();toast('Campaign updated');view()},
async delc(){if(!confirm('Delete this campaign? Its rewards, clips, chat and files will be deleted too. This cannot be undone.'))return;const{data:fs}=await sb.from('campaign_files').select('path').eq('campaign_id',S.cid);const{error}=await sb.rpc('delete_campaign',{p_campaign:S.cid});if(error)return toast(error.message);if((fs||[]).length)await sb.storage.from('campaign-files').remove(fs.map(f=>f.path));closeM();S.cid=null;toast('Campaign deleted');view()},
editr(d){const r=S.c.rewards.find(x=>x.id===d.id);S.er=r.id;modal(`<h2>Edit reward</h2><label>Brand paying for it</label><input id="rb" value="${esc(r.brand_name)}"><label>Reward title</label><input id="rt" value="${esc(r.title)}"><label>Rules</label><textarea id="rr" rows="3">${esc(r.rules)}</textarea><label>Source content link</label><input id="ru" type="url" value="${esc(r.source_url)}"><label>Rate per 1,000 views (GHS)</label><input id="rp" type="number" inputmode="decimal" value="${r.rate_per_1k}"><label>Budget (GHS)</label><input id="rg" type="number" inputmode="decimal" value="${r.target_budget}"><div class="note">A new rate applies to clips approved from now on.</div><div class="btns"><button class="btn" data-a="saver">Save changes</button><button class="btn ghost" data-a="close">Cancel</button></div><div class="btns"><button class="btn red" data-a="delr">Delete reward</button></div>`)},
async saver(){const t=val('rt'),p=+val('rp'),g=+val('rg');if(!t||p<=0||g<=0)return toast('Add a title, rate and budget');const{error}=await sb.from('rewards').update({brand_name:val('rb'),title:t,rules:val('rr'),source_url:val('ru')||null,rate_per_1k:p,target_budget:g}).eq('id',S.er);if(error)return toast(error.message);closeM();toast('Reward updated');view()},
async delr(){if(!confirm('Delete this reward?'))return;const{error}=await sb.rpc('delete_reward',{p_reward:S.er});if(error)return toast(error.message);closeM();toast('Reward deleted');view()},
sf(d){S.sf=d.id;A.subs()},
async subs(){const f=S.sf||'pending';const{data}=await sb.from('submissions').select('*,rewards(brand_name,title,rate_per_1k,currency,funded,spent)').eq('campaign_id',S.cid).eq('status',f).order('views',{ascending:false});const ids=[...new Set((data||[]).map(s=>s.creator_id))],nm={};if(ids.length)((await sb.from('people').select('*').in('id',ids)).data||[]).forEach(p=>nm[p.id]=p.name);
 modal(`<h2>Clips</h2><div class="chips" style="margin-top:8px">${['pending','approved','rejected'].map(k=>`<button class="chip ${f===k?'on':''}" data-a="sf" data-id="${k}">${k}</button>`).join('')}</div><div class="meta">Ranked by views, highest first. Views update automatically.</div>`+((data||[]).length?data.map((s,i)=>{const r=s.rewards,pay=Math.max(0,Math.min(s.views/1000*r.rate_per_1k,r.funded-r.spent))*.9;return `<div class="item" style="display:block"><div class="row"><div><b>#${i+1} ${esc(nm[s.creator_id]||'Creator')}</b><div class="meta">${esc(r.brand_name||'')} · ${esc(r.title)}</div></div><div class="rate" style="font-size:18px">${vw(s)}</div></div><div class="meta" style="word-break:break-all"><a href="${safe(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></div>${s.reject_reason?`<div class="note">Reason: ${esc(s.reject_reason)}</div>`:''}<div class="btns" style="margin-top:6px"><button class="chip" data-a="dm" data-c="${S.cid}" data-id="${s.creator_id}">Message ${esc(nm[s.creator_id]||'creator')}</button></div>${s.status==='pending'?`<div class="btns"><button class="btn" data-a="ok" data-id="${s.id}">Approve · pays ${fm(pay,r.currency)}</button><button class="btn red" data-a="rej" data-id="${s.id}">Reject</button></div>`:''}</div>`}).join(''):'<div class="empty">Nothing here.</div>')+`<div class="btns"><button class="btn ghost" data-a="close">Close</button></div>`)},
async ok(d){const{error}=await sb.rpc('approve_submission',{p_sub:d.id});toast(error?error.message:'Approved and paid');A.subs()},
rej(d){S.rj=d.id;modal(`<h2>Reject this clip</h2><label>Reason (the creator will see this)</label><textarea id="rs" rows="3" placeholder="e.g. Missing the required hashtag"></textarea><div class="btns"><button class="btn red" data-a="dorej">Reject clip</button><button class="btn ghost" data-a="subs">Back</button></div>`)},
async dorej(){const r=val('rs');if(r.length<3)return toast('Please give a reason');const{error}=await sb.rpc('reject_submission',{p_sub:S.rj,p_reason:r});toast(error?error.message:'Clip rejected');A.subs()},
async team(){const[i,m]=await Promise.all([sb.from('manager_invites').select('code').eq('campaign_id',S.cid).maybeSingle(),sb.from('campaign_members').select('user_id').eq('campaign_id',S.cid).eq('role','manager')]);const ids=(m.data||[]).map(x=>x.user_id),nm={};if(ids.length)((await sb.from('people').select('*').in('id',ids)).data||[]).forEach(p=>nm[p.id]=p.name);
 modal(`<h2>Team</h2><div class="meta">Managers can review clips, approve, reject and add rewards.</div><div class="card" style="margin-top:12px"><div class="meta">Manager invite code</div><div class="bal" style="font-size:28px;letter-spacing:2px">${esc(i.data?.code||'')}</div><div class="note">Send this code to someone you trust. They tap Profile, then Join a campaign as manager.</div></div><div class="sec"><h3>Managers</h3></div>${ids.map(x=>`<div class="item"><span>${esc(nm[x]||'Manager')}${x===U.id?' (you)':''}</span></div>`).join('')}<div class="btns"><button class="btn ghost" data-a="close">Close</button></div>`)},
jm(){modal(`<h2>Join as manager</h2><label>Invite code</label><input id="jc" autocapitalize="none"><div class="btns"><button class="btn" data-a="savejm">Join</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async savejm(){const{data,error}=await sb.rpc('join_as_manager',{p_code:val('jc')});if(error)return toast(error.message);closeM();S.cid=data;toast('You are now a manager');view()},
addm(){modal(`<h2>Add payout method</h2><label>MoMo or bank</label><select id="n"><optgroup label="Mobile money">${MOMO.map(x=>`<option>${x}</option>`).join('')}</optgroup><optgroup label="Bank"><option>GCB Bank</option><option>Ecobank Ghana</option><option>Stanbic Bank</option><option>Fidelity Bank</option><option>Absa Ghana</option></optgroup></select><label>Phone or account number</label><input id="d" inputmode="numeric"><label>Account name</label><input id="u" value="${esc(P.name)}"><div class="btns"><button class="btn" data-a="savem">Save</button><button class="btn ghost" data-a="close">Cancel</button></div>`)},
async savem(){const d=val('d').replace(/\D/g,''),n=val('n');if(d.length<8||!val('u'))return toast('Enter a valid number and account name');
 const{error}=await sb.from('payout_methods').insert({user_id:U.id,type:MOMO.includes(n)?'momo':'bank',provider:n,last4:d.slice(-4),account_name:val('u')});if(error)return toast(error.message);closeM();view();toast('Payout method added')},
async rmm(d){await sb.from('payout_methods').delete().eq('id',d.id);view()}};
document.addEventListener('click',e=>{if(e.target.id==='modal')return closeM();const t=e.target.closest('[data-a]');if(t)A[t.dataset.a](t.dataset)});
</script>
</body>
</html>
